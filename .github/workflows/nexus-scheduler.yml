name: Nexus scheduler integration
on:
  push:
    branches: [main]
    paths:
      - 'scheduler/**'
      - 'core/budget.js'
      - 'lifecycle/scheduler.js'
      - 'lifecycle/intelligence.js'
      - 'memory/**'
      - 'postturn/pipeline.js'
      - 'maintenance/housekeeper.js'
      - 'smart-context/warmer.js'
      - 'nexus/mutation-coordinator.js'
      - 'index.js'
      - 'nexus/generation-frame*.js'
      - 'nexus/scatter-gather-runtime.js'
      - 'nexus/model-worker-bus.js'
      - 'tree/summarizer.js'
      - 'tree/keyword-advisor.js'
      - 'nexus/scene-intelligence.js'
      - 'nexus/green-room.js'
      - 'tests/integration-hand-offs.mjs'
      - 'tests/world-tree-scene-contribution.mjs'
      - 'tests/world-tree-character-memory.mjs'
      - 'tests/world-tree-memory-contribution.mjs'
      - 'nexus/work-director.js'
      - 'nexus/diagnostics-source.js'
      - 'tests/scheduler-*.mjs'
      - 'tests/dynamic-budget.mjs'
      - 'tests/foreground-retrieval-plumbing.mjs'
      - 'tests/jev-selected-turn-plumbing.mjs'
      - 'tests/selected-turn-reporting.mjs'
      - 'tests/detailed-owner-reporting.mjs'
      - 'tests/nexus-diagnostics-owner-wiring.mjs'
      - 'retrieval/graph-inspection.js'
      - 'nexus-ui-bindings.js'
      - 'nexus-ui-host.js'
      - 'scene/runtime.js'
      - 'retrieval/diagnostics.js'
      - 'sidecar/bus.js'
      - 'sidecar/client.js'
      - 'decision/**'
      - 'core/continuity-channel.js'
      - 'nexus/hot-cognition.js'
      - '.github/workflows/nexus-scheduler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-turn-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sidecar-no-pinning.mjs tests/scheduler-owner-publication.mjs tests/scheduler-tree-owner.mjs tests/scheduler-owner-steps.mjs tests/scheduler-late-owner.mjs tests/scheduler-installed-routing.mjs tests/scheduler-gather.mjs tests/scheduler-background.mjs tests/scheduler-sidecars.mjs tests/dynamic-budget.mjs tests/scheduler-job-table.mjs tests/scheduler-leased-steps.mjs tests/scheduler-lifecycle-parity.mjs tests/scheduler-planner-parity.mjs tests/scheduler-scene-jobs.mjs tests/scheduler-installed-boundary.mjs tests/world-tree-scene-contribution.mjs tests/world-tree-character-memory.mjs tests/world-tree-memory-contribution.mjs tests/task8-postturn-decision-sites.mjs tests/task8-foreground-decision-sites.mjs tests/integration-hand-offs.mjs tests/ephemeral-working-state.mjs tests/system-diagnostics-wiring.mjs tests/foreground-retrieval-plumbing.mjs tests/jev-selected-turn-plumbing.mjs tests/nexus-diagnostics-owner-wiring.mjs tests/selected-turn-reporting.mjs tests/detailed-owner-reporting.mjs
      - run: node tests/task202-203-lifecycle-contract.mjs
      - run: node tests/task203-lifecycle-execution-leases.mjs
      - run: node tests/task202-continuable-work.mjs
      - run: node tests/a52-scatter-gather-full.mjs

name: Nexus World Tree integration
on:
  push:
    branches: [main]
    paths:
      - 'core/world-tree-api.js'
      - 'core/ephemeral-state.js'
      - 'core/continuity-channel.js'
      - 'core/system-telemetry.js'
      - 'core/world-tree-events.js'
      - 'nexus-ui-host.js'
      - 'tests/world-tree-events.mjs'
      - 'observability/system-events.js'
      - 'nexus/diagnostics-source.js'
      - 'nexus-ui-bindings.js'
      - 'src/ui-core/wave13-operator-surfaces.js'
      - 'sidecar/provider-check.js'
      - 'tests/system-diagnostics-wiring.mjs'
      - 'tests/integration-hand-offs.mjs'
      - 'nexus/hot-cognition.js'
      - 'nexus/green-room.js'
      - 'tests/ephemeral-working-state.mjs'
      - 'world-tree/**'
      - 'nexus/a52/shared/world-tree-api.js'
      - 'nexus/a52/truth/**'
      - 'nexus/a52/sensory/**'
      - 'memory/recall.js'
      - 'memory/store.js'
      - 'memory/character-banks.js'
      - 'lore/store.js'
      - 'tree/store.js'
      - 'paging/runtime.js'
      - 'retrieval/retriever.js'
      - 'tests/world-tree-reader.mjs'
      - 'tests/world-tree-intake.mjs'
      - 'tests/world-tree-tracking.mjs'
      - 'tests/world-tree-card-contribution.mjs'
      - 'tests/world-tree-scene-contribution.mjs'
      - 'tests/world-tree-character-memory.mjs'
      - 'tests/world-tree-memory-contribution.mjs'
      - 'tests/world-tree-subsystem-plumbing.mjs'
      - 'tests/memory-world-tree-parity.mjs'
      - 'tests/character-world-tree-parity.mjs'
      - 'tests/lore-world-tree-parity.mjs'
      - '.github/workflows/nexus-world-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/world-tree-intake.mjs tests/world-tree-tracking.mjs tests/world-tree-card-contribution.mjs tests/world-tree-scene-contribution.mjs tests/world-tree-character-memory.mjs tests/world-tree-memory-contribution.mjs tests/world-tree-subsystem-plumbing.mjs tests/task8-postturn-decision-sites.mjs tests/task8-foreground-decision-sites.mjs tests/memory-world-tree-parity.mjs tests/character-world-tree-parity.mjs tests/lore-world-tree-parity.mjs tests/world-tree-reader.mjs tests/world-tree-core.mjs tests/world-tree-events.mjs tests/ephemeral-working-state.mjs tests/integration-hand-offs.mjs tests/system-diagnostics-wiring.mjs tests/nexus-ui-runtime-binding.mjs tests/nexus-ui-core-contract.mjs
      - run: node tests/nexus-diagnostics-source.mjs
      - run: node tests/a52-world-tree-runtime-adapter.mjs
      - run: node tests/a52-truth-gate-full.mjs
      - run: node tests/a52-sensory-walker-full.mjs
      - run: node tests/a52-hot-cognition-full.mjs
      - run: node tests/a52-green-room-full.mjs
      - run: node tests/a52-scene-intelligence-full.mjs
      - run: node --check core/world-tree-api.js && node --check memory/recall.js && node --check memory/character-banks.js && node --check lore/store.js && node --check tree/store.js && node --check paging/runtime.js && node --check retrieval/retriever.js

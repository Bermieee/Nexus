name: Nexus World Tree integration
on:
  push:
    branches: [main]
    paths:
      - 'core/world-tree-api.js'
      - 'core/foreground-budget.js'
      - 'tools/check-es-modules.mjs'
      - 'tools/run-offline-checks.mjs'
      - 'core/ephemeral-state.js'
      - 'core/continuity-channel.js'
      - 'core/system-telemetry.js'
      - 'core/world-tree-events.js'
      - 'nexus-ui-host.js'
      - 'tests/world-tree-events.mjs'
      - 'observability/system-events.js'
      - 'nexus/diagnostics-source.js'
      - 'nexus-ui-bindings.js'
      - 'src/ui-core/wave13-operator-surfaces.js'
      - 'sidecar/provider-check.js'
      - 'tests/system-diagnostics-wiring.mjs'
      - 'tests/nexus-diagnostics-owner-wiring.mjs'
      - 'tests/integration-hand-offs.mjs'
      - 'nexus/hot-cognition.js'
      - 'nexus/green-room.js'
      - 'tests/ephemeral-working-state.mjs'
      - 'world-tree/**'
      - 'nexus/a52/shared/world-tree-api.js'
      - 'nexus/a52/truth/**'
      - 'nexus/a52/sensory/**'
      - 'memory/recall.js'
      - 'memory/store.js'
      - 'memory/character-banks.js'
      - 'lore/store.js'
      - 'tree/store.js'
      - 'paging/runtime.js'
      - 'retrieval/retriever.js'
      - 'tests/world-tree-reader.mjs'
      - 'tests/world-tree-story-binding.mjs'
      - 'tests/world-tree-intake.mjs'
      - 'tests/world-tree-tracking.mjs'
      - 'tests/world-tree-card-contribution.mjs'
      - 'tests/world-tree-scene-contribution.mjs'
      - 'tests/world-tree-character-memory.mjs'
      - 'tests/world-tree-memory-contribution.mjs'
      - 'tests/world-tree-subsystem-plumbing.mjs'
      - 'tests/world-tree-growth-watch-decisions.mjs'
      - 'tests/decision-record-trace.mjs'
      - 'tests/world-tree-durable-state.mjs'
      - 'tests/world-tree-bank-write-origin.mjs'
      - 'tests/memory-world-tree-parity.mjs'
      - 'tests/character-world-tree-parity.mjs'
      - 'tests/lore-world-tree-parity.mjs'
      - 'tests/truth-authority-timing.mjs'
      - 'tests/truth-support-only.mjs'
      - 'nexus/truth-classification.js'
      - '.github/workflows/nexus-world-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/world-tree-story-binding.mjs tests/nexus-diagnostics-owner-wiring.mjs tests/world-tree-intake.mjs tests/world-tree-tracking.mjs tests/world-tree-card-contribution.mjs tests/world-tree-scene-contribution.mjs tests/world-tree-character-memory.mjs tests/world-tree-memory-contribution.mjs tests/world-tree-subsystem-plumbing.mjs tests/world-tree-growth-watch-decisions.mjs tests/decision-record-trace.mjs tests/world-tree-durable-state.mjs tests/world-tree-bank-write-origin.mjs tests/task8-postturn-decision-sites.mjs tests/task8-foreground-decision-sites.mjs tests/memory-world-tree-parity.mjs tests/character-world-tree-parity.mjs tests/lore-world-tree-parity.mjs tests/truth-authority-timing.mjs tests/truth-support-only.mjs tests/world-tree-reader.mjs tests/world-tree-core.mjs tests/world-tree-events.mjs tests/ephemeral-working-state.mjs tests/integration-hand-offs.mjs tests/system-diagnostics-wiring.mjs tests/nexus-ui-runtime-binding.mjs tests/nexus-ui-core-contract.mjs
      - run: node tests/nexus-diagnostics-source.mjs
      - run: node tests/a52-world-tree-runtime-adapter.mjs
      - run: node tests/a52-truth-gate-full.mjs
      - run: node tests/a52-sensory-walker-full.mjs
      - run: node tests/a52-hot-cognition-full.mjs
      - run: node tests/a52-green-room-full.mjs
      - run: node tests/a52-scene-intelligence-full.mjs
      - name: Explicit browser-module smoke gate
        run: node --experimental-vm-modules tools/check-es-modules.mjs
      - name: Growth repair production-envelope regressions
        run: node --experimental-vm-modules --test tests/module-startup-smoke.mjs tests/scene-memory-freshness.mjs tests/world-tree-contribution-repair.mjs tests/world-tree-lore-deltas.mjs tests/world-tree-edge-growth-repair.mjs tests/world-tree-graph-derivation.mjs tests/retrieval-budget-runtime.mjs tests/sensory-continuation-background.mjs tests/world-tree-decision-delivery.mjs tests/world-tree-watch-handoffs.mjs tests/task8-runtime-growth-delivery.mjs tests/task8-review-proposal-delivery.mjs tests/foreground-budget-handoff.mjs

name: Area-52 core port validation
on:
  push:
    branches:
      - 'a52-*'
  workflow_dispatch:
jobs:
  core-port:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/a52-core-port.mjs
      - run: if [ -f tests/a52-supporting-systems.mjs ]; then node tests/a52-supporting-systems.mjs; fi
      - run: if [ -f tests/a52-truth-gate-full.mjs ]; then node tests/a52-truth-gate-full.mjs; fi
      - run: if [ -f tests/a52-sensory-walker-full.mjs ]; then node tests/a52-sensory-walker-full.mjs; fi
      - run: if [ -f tests/a52-hot-cognition-full.mjs ]; then node tests/a52-hot-cognition-full.mjs; fi
      - run: node --check nexus/hot-cognition.js && node --check scene/runtime.js && node --check memory/notebook.js && node --check retrieval/retriever.js && node --check index.js
